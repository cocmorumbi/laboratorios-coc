<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <!-- Configuração PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#6f9c22">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agenda de Laboratórios</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="calendar-container">

    <div class="header-title-container">
      <h1 class="main-page-title">COC</h1>
      <h3 class="main-page-subtitle">LABORATÓRIOS</h3>
    </div>

    <div class="top-controls-bar">
      <!-- Linha de Cima: Botões Lado a Lado -->
      <div class="top-buttons-row">
        <button class="theme-toggle-btn" id="themeToggleBtn" onclick="toggleDarkMode()">
          <span class="theme-icon" id="themeIcon">🌘</span>
          <span class="theme-text" id="themeText">Modo Escuro</span>
        </button>
        
        <button class="monthly-toggle-btn" id="monthlyViewBtn" onclick="toggleMonthlyView()">
          <span>📅</span> Visão Mensal
        </button>
      </div>

      <!-- Linha de Baixo: Filtro de Sala Horizontal -->
      <div class="room-filter-container">
        <label for="globalRoomFilter">Filtrar Sala:</label>
        <select id="globalRoomFilter" onchange="applyRoomFilter()">
          <option value="">Todas as Salas</option>
          <option value="Informática">Informática</option>
          <option value="Auditório">Auditório</option>
          <option value="Química">Química</option>
          <option value="Matemática">Matemática</option>
        </select>
      </div>
    </div>

    <div class="month-page" id="page">
      
      <div class="month-navigation">
        <div class="nav-arrow" onclick="changeMonth(-1)">◀</div>
        <div class="month-header-large">
          <span class="month-name" id="monthLabel">JANEIRO</span>
          <span class="year-number" id="yearLabel">2026</span>
        </div>
        <div class="nav-arrow" onclick="changeMonth(1)">▶</div>
      </div>
      
      <div class="weeks-stack" id="weeksStack"></div>

      <div class="day-drawer" id="dayDrawer">
        <div class="drawer-header">
          <h3 class="drawer-title" id="drawerDate">Dia</h3>
          <button class="close-btn" onclick="closeDrawer()">✕</button>
        </div>

        <div class="holiday-notice" id="holidayNotice">
          <div class="holiday-icon">🎉</div>
          <h4 class="holiday-title">Feriado</h4>
          <p class="holiday-name" id="holidayName">Nome do Feriado</p>
          <span class="holiday-badge">Não é possível fazer agendamento nesta data!</span>
        </div>

        <div class="events-list" id="eventsList"></div>

        <form class="schedule-form" id="bookingForm" onsubmit="handleSchedule(event)">
          <h3 class="form-title">NOVO AGENDAMENTO</h3>
          <input type="text" id="eventTitle" placeholder="Nome / Professor" required>
          
          <select id="eventLocation" onchange="updateAvailableTimes()" required>
            <option value="" disabled selected hidden>Selecione o Local</option>
            <option value="Informática">Informática</option>
            <option value="Auditório">Auditório</option>
            <option value="Química">Química</option>
            <option value="Matemática">Matemática</option>
          </select>

          <select id="eventTime" disabled required>
            <option value="" disabled selected hidden>Selecione o local primeiro</option>
          </select>

          <button type="submit">Confirmar Agendamento</button>
        </form>
      </div>

    </div>
  </div>

  <script src="script.js"></script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then((reg) => console.log('PWA Service Worker registrado com sucesso!', reg))
          .catch((err) => console.log('Erro ao registrar Service Worker:', err));
      });
    }
  </script>
</body>
</html>
